# ~/.tmux.conf — symlinked by ./install.sh.

# Large scrollback so `less`-ing through long build/test output doesn't get
# cut off.
set -g history-limit 50000

# Default keeps tmux waiting after Escape to see if more bytes are coming
# (part of an arrow-key/meta sequence) — that delay makes vim/nvim's normal
# mode feel laggy. tmux only needs a few ms to tell the difference.
set -sg escape-time 10

# Panes/windows numbered from 1, not 0 — 0 is awkward to reach on a keyboard
# and doesn't match window position on the status line.
set -g base-index 1
setw -g pane-base-index 1

# Mouse: click to select a pane/window, drag to resize, scroll to scroll.
set -g mouse on

# vi-style keys in copy mode (prefix + [), since everything else here
# assumes a vim-shaped muscle memory.
setw -g mode-keys vi

# Renumber windows automatically when one closes, so gaps don't accumulate.
set -g renumber-windows on

# Minimal status bar: session name left, date/time right.
set -g status-style fg=colour15,bg=colour234
set -g status-left "#[bold] #S "
set -g status-right "%Y-%m-%d %H:%M"
